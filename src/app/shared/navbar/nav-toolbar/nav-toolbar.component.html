<!-- Top navbar — shows different links based on authentication state -->
<div class="sticky top-0 bg-blue-500 text-white flex items-center justify-between p-4 z-50 shadow-md">
  <div class="text-lg font-semibold">
    <a routerLink="/home">Hotel Management</a>
  </div>

  <!-- Desktop links — Bookings removed, reservations are managed from the dashboard -->
  <div class="hidden md:flex space-x-4 items-center">
    @if (!isAuthenticated) {
      <a routerLink="/register" class="hover:text-orange-500 transition duration-300">Register</a>
      <a routerLink="/login" class="hover:text-orange-500 transition duration-300">Login</a>
    } @else {
      <!-- Show dashboard link and logout when authenticated -->
      <a routerLink="/dashboard" class="hover:text-orange-500 transition duration-300">Dashboard</a>
      <button class="hover:text-orange-500 transition duration-300 bg-transparent border-none text-white cursor-pointer text-base"
              (click)="logout()">Logout</button>
    }
  </div>

  <!-- Mobile hamburger menu -->
  <button class="md:hidden" (click)="toggleMenu()">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>
</div>

<!-- Mobile dropdown menu — Bookings removed, reservations are managed from the dashboard -->
<div [ngClass]="{ 'block': isMenuOpen, 'hidden': !isMenuOpen }" class="md:hidden bg-blue-500 text-white p-4 space-y-2">
  @if (!isAuthenticated) {
    <a routerLink="/register" class="block hover:text-orange-500 transition duration-300">Register</a>
    <a routerLink="/login" class="block hover:text-orange-500 transition duration-300">Login</a>
  } @else {
    <a routerLink="/dashboard" class="block hover:text-orange-500 transition duration-300">Dashboard</a>
    <button class="block hover:text-orange-500 transition duration-300 bg-transparent border-none text-white cursor-pointer text-base"
            (click)="logout()">Logout</button>
  }
</div>
<router-outlet></router-outlet>
