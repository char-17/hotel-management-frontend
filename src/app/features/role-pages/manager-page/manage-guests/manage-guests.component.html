<div class="mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center">
    <mat-icon class="mr-2 text-blue-600">people</mat-icon>
    Guest Management
    <!-- Add New guest button — inserts a blank editable row at the top -->
    <button mat-fab color="accent" (click)="addItem()" matTooltip="Add New Guest" class="ml-4" [disabled]="isCreating">
      <mat-icon>add</mat-icon>
    </button>
  </h1>

  <!-- Data table for guests -->
  <mat-card class="shadow-lg overflow-hidden" [hidden]="isLoading">
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" matSort class="w-full">

        <ng-container matColumnDef="guestID">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">ID</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <span class="static-field">{{ item.guestID }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">First Name</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <input *ngIf="editingIndex === i" [(ngModel)]="item.firstName" class="editable-field">
            <span *ngIf="editingIndex !== i" class="static-field">{{ item.firstName }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">Last Name</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <input *ngIf="editingIndex === i" [(ngModel)]="item.lastName" class="editable-field">
            <span *ngIf="editingIndex !== i" class="static-field">{{ item.lastName }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">Email</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <input *ngIf="editingIndex === i" [(ngModel)]="item.email" type="email" class="editable-field">
            <span *ngIf="editingIndex !== i" class="static-field">{{ item.email }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">Phone</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <input *ngIf="editingIndex === i" [(ngModel)]="item.phone" class="editable-field">
            <span *ngIf="editingIndex !== i" class="static-field">{{ item.phone }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">Address</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <input *ngIf="editingIndex === i" [(ngModel)]="item.address" class="editable-field">
            <span *ngIf="editingIndex !== i" class="static-field">{{ item.address }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="dateOfBirth">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold">Date of Birth</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <input *ngIf="editingIndex === i" [(ngModel)]="item.dateOfBirth" type="date" class="editable-field">
            <span *ngIf="editingIndex !== i" class="static-field">{{ item.dateOfBirth }}</span>
          </td>
        </ng-container>

        <!-- Action buttons column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="bg-blue-50 font-bold w-40">Actions</th>
          <td mat-cell *matCellDef="let item; let i = index">
            <div class="flex space-x-2 justify-center">
              <button *ngIf="editingIndex !== i" mat-icon-button color="primary" (click)="editItem(i)" matTooltip="Edit" class="action-button">
                <mat-icon>edit</mat-icon>
              </button>
              <button *ngIf="editingIndex === i" mat-icon-button color="primary" (click)="saveItem(i)" matTooltip="Save" class="action-button">
                <mat-icon>save</mat-icon>
              </button>
              <button *ngIf="editingIndex === i" mat-icon-button (click)="cancelEdit()" matTooltip="Cancel" class="action-button text-gray-600 hover:text-red-600">
                <mat-icon>cancel</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteItem(i)" matTooltip="Delete" class="action-button">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="h-12"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            [class.bg-blue-50]="editingIndex !== null && editingIndex === dataSource.data.indexOf(row)"
            class="hover:bg-gray-50 transition-colors"></tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons class="border-t" aria-label="Select page"></mat-paginator>
  </mat-card>

  <div *ngIf="isLoading" class="flex flex-col items-center justify-center mt-16">
    <mat-spinner diameter="64" class="mb-4"></mat-spinner>
    <p class="text-lg text-gray-600">Loading guests data...</p>
  </div>

  <div class="fixed bottom-4 right-4">
    <button mat-fab color="primary" (click)="loadData()" matTooltip="Refresh data">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
</div>
