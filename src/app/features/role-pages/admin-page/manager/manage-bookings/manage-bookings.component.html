<!-- Booking management table — reads from and writes to the real API -->
<div [formGroup]="bookingForm" class="p-4 max-w-full mx-auto">

  <!-- Add new booking button -->
  <div class="mb-4">
    <button mat-raised-button color="primary" (click)="addNewBooking()" [disabled]="!canAddNewBooking">
      <mat-icon>add</mat-icon> Add Booking
    </button>
  </div>

  <ng-container formArrayName="bookingRows">
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-full">

        <!-- Booking ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="p-2 text-left">ID</th>
          <td mat-cell *matCellDef="let element; let i = index;" [formGroupName]="i" class="p-2">
            <mat-form-field class="w-full">
              <input matInput formControlName="id" readonly>
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Check In Date -->
        <ng-container matColumnDef="checkInDate">
          <th mat-header-cell *matHeaderCellDef class="p-2 text-left">Check In</th>
          <td mat-cell *matCellDef="let element; let i = index;" [formGroupName]="i" class="p-2">
            <mat-form-field class="w-full">
              <input matInput type="date" formControlName="checkInDate"
                     [readonly]="!element.get('isEditable')?.value">
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Check Out Date -->
        <ng-container matColumnDef="checkOutDate">
          <th mat-header-cell *matHeaderCellDef class="p-2 text-left">Check Out</th>
          <td mat-cell *matCellDef="let element; let i = index;" [formGroupName]="i" class="p-2">
            <mat-form-field class="w-full">
              <input matInput type="date" formControlName="checkOutDate"
                     [readonly]="!element.get('isEditable')?.value">
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Room ID -->
        <ng-container matColumnDef="roomId">
          <th mat-header-cell *matHeaderCellDef class="p-2 text-left">Room ID</th>
          <td mat-cell *matCellDef="let element; let i = index;" [formGroupName]="i" class="p-2">
            <mat-form-field class="w-full">
              <input matInput type="number" formControlName="roomId"
                     [readonly]="!element.get('isEditable')?.value">
            </mat-form-field>
          </td>
        </ng-container>

        <!-- User ID -->
        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef class="p-2 text-left">User ID</th>
          <td mat-cell *matCellDef="let element; let i = index;" [formGroupName]="i" class="p-2">
            <mat-form-field class="w-full">
              <input matInput type="number" formControlName="userId"
                     [readonly]="!element.get('isEditable')?.value">
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Actions: edit/save/cancel/delete wired to real API calls -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="p-2 text-left">Actions</th>
          <td mat-cell *matCellDef="let element; let i = index" [formGroupName]="i" class="p-2">
            @if (element.get('isEditable')?.value) {
              <button mat-icon-button color="primary" matTooltip="Save" (click)="saveBooking(i)">
                <mat-icon>save</mat-icon>
              </button>
              <button mat-icon-button matTooltip="Cancel" (click)="cancelEdit(i)">
                <mat-icon>cancel</mat-icon>
              </button>
            } @else {
              <button mat-icon-button color="primary" matTooltip="Edit" (click)="editBooking(i)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Delete" (click)="deleteBooking(i)">
                <mat-icon>delete</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <!-- Header and data rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>
  </ng-container>
</div>
